<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="content-type" content="text/html;charset=utf-8"/>
    <title>Amazing Slider</title>
    
    <!-- Insert to your webpage before the </head> -->
    <script src="sliderengine/jquery.js"></script>
    <script src="sliderengine/amazingslider.js"></script>
    <link rel="stylesheet" type="text/css" href="sliderengine/amazingslider-1.css">
    <script src="sliderengine/initslider-1.js"></script>
    <!-- End of head section HTML codes -->
    
</head>
<body>
    
    <!-- Insert to your webpage where you want to display the slider -->
    <div class="amazingslider-wrapper" id="amazingslider-wrapper-1" style="display:block;position:relative;max-width:1200px;margin:0px auto 48px;">
        <div class="amazingslider" id="amazingslider-1" style="display:block;position:relative;margin:0 auto;">
            <ul class="amazingslider-slides" style="display:none;">
                <li><img src="images/wmremove-transformed.png" alt="&quot;El Sabor De Lo Nuestro&quot;"  title="&quot;El Sabor De Lo Nuestro&quot;" data-description="&quot;Donde el amor se hornea diario&quot;" />
                </li>
                <li><img src="images/pastel%20carrusel.jpg" alt="Pastel de Nuez"  title="Pastel de Nuez" data-description="Interior de nuestro clasico pastel de Nuez" />
                </li>
                <li><img src="images/pastel%20carrusel%202.jpg" alt="Pastel de Zanahoria"  title="Pastel de Zanahoria" data-description="Rebanada de nuestro clasico pastel de Zanahoria" />
                </li>
                <li><img src="images/pastel%20carrusel%203.jpg" alt="Pastel de Chocolate"  title="Pastel de Chocolate" data-description="Disfruta de un rico pastel sabor Chocolate en pasteleria &quot;El sabor de lo nuestro&quot;" />
                </li>
            </ul>
        <div class="amazingslider-engine"><a href="http://amazingslider.com" title="JavaScript Slideshow">JavaScript Slideshow</a></div>
        </div>
    </div>
    <!-- End of body section HTML codes -->
    
</body>
</html>
